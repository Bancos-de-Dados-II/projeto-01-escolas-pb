<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mapa das Escolas - Paraíba | Dados Educacionais</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/leaflet-overrides.css">
</head>
<body>
    <div class="app-container">
        <div id="map" class="map-container"></div>

        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-graduation-cap"></i> Educação na Paraíba</h2>
                <p>Distribuição de escolas por município</p>
            </div>

            <div class="sidebar-content">
                <div class="stats-container" id="statsContainer">
                    <div class="stat-card">
                        <span class="stat-label"><i class="fas fa-city"></i> Municípios</span>
                        <span class="stat-value" id="totalMun">-</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label"><i class="fas fa-school"></i> Total</span>
                        <span class="stat-value" id="totalEscolas">-</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label"><i class="fas fa-chart-line"></i> Média</span>
                        <span class="stat-value" id="mediaEscolas">-</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label"><i class="fas fa-trophy"></i> Máx.</span>
                        <span class="stat-value" id="maiorMunicipio">-</span>
                    </div>
                </div>

                <div class="chart-container">
                    <h3><i class="fas fa-chart-bar"></i> Top 10 municípios</h3>
                    <canvas id="rankingChart" width="280" height="240"></canvas>
                </div>

                <div class="legend-container">
                    <h3><i class="fas fa-palette"></i> Escolas por município</h3>
                    <div class="legend-items">
                        <div class="legend-item"><span style="background:#e8f4f8;"></span> <small>0–20</small></div>
                        <div class="legend-item"><span style="background:#d9f0f7;"></span> <small>21–50</small></div>
                        <div class="legend-item"><span style="background:#a0c4e5;"></span> <small>51–100</small></div>
                        <div class="legend-item"><span style="background:#6a9bc3;"></span> <small>101–150</small></div>
                        <div class="legend-item"><span style="background:#3c6e8f;"></span> <small>151–200</small></div>
                        <div class="legend-item"><span style="background:#1b3b4f;"></span> <small>200+</small></div>
                    </div>
                </div>

                <div class="footer-note">
                    <small><i class="fas fa-database"></i> Fonte: INEP / Censo Escolar</small>
                </div>
            </div>
        </div>

        <div class="filtro-card">
            <div class="filtro-header">
                <i class="fas fa-filter"></i>
                <span>Filtro</span>
                <span class="tooltip-icon" data-tooltip="Filtre municípios por número mínimo de escolas">
                    <i class="fas fa-question-circle"></i>
                </span>
            </div>
            <div class="filtro-body">
                <label for="filtroSlider">Mínimo de escolas</label>
                <input type="range" id="filtroSlider" min="0" max="300" value="0" step="5">
                <div class="filtro-value">
                    <span id="valorSlider">0</span> escolas
                </div>
                <button id="aplicarFiltro">
                    <i class="fas fa-check"></i> Aplicar filtro
                </button>
                <div class="loading" id="loadingIndicator" style="display:none;">
                    <i class="fas fa-spinner fa-spin"></i> Carregando...
                </div>
            </div>
        </div>

        <div class="search-card">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Digite o nome do município...">
                <ul class="search-results" id="searchResults" style="display: none;"></ul>
            </div>
        </div>

        <div class="info-panel" id="infoPanel">
            <div class="info-header">
                <i class="fas fa-info-circle"></i>
                <span id="infoPanelTitle">Informações</span>
                <button class="info-close" id="infoCloseBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="info-body" id="infoPanelBody">
                <p><i class="fas fa-map-location-dot"></i> Selecione um município no mapa.</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/services/supabaseService.js"></script>
    <script src="js/controllers/mapController.js"></script>
    <script src="js/controllers/uiController.js"></script>
    <script src="js/controllers/filterController.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
